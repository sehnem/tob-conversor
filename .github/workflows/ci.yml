name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: the jobs below gate on `-D warnings`, so a floating `stable`
      # turns every new Clippy lint into a red build on untouched code.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: ruff check
        run: |
          pip install 'ruff==0.16.7'
          ruff check tob_conversor_py/python/ examples/
          ruff format --check tob_conversor_py/python/ examples/

      - name: cargo fmt
        run: cargo fmt --check --manifest-path tob_conversor_rs/Cargo.toml

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --manifest-path tob_conversor_rs/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path tob_conversor_rs/Cargo.toml

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      # `maturin develop` installs into an *active* virtualenv, and
      # actions/setup-python does not provide one, so it fails before it builds.
      # Build a wheel and install that into the job's interpreter instead.
      # Install the built file by path, never `pip install tob`: the name `tob`
      # on PyPI is an unrelated project.
      - name: Build and install the extension
        run: |
          pip install maturin
          maturin build --release --manifest-path tob_conversor_py/Cargo.toml --out dist
          pip install dist/*.whl

      - name: Install test dependencies
        run: pip install pytest pytest-cov matplotlib numpy

      - name: Run tests
        run: pytest tob_conversor_py/tests/ -v --tb=short
