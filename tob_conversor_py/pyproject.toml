[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "tob"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=18.0",
    "pandas>=2.0",
    "polars>=1.0",
    "duckdb>=1.0",
]

[tool.maturin]
python-source = "python"
module-name = "tob._core"
features = ["extension-module"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "maturin>=1.8",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "ty>=0.0.1",
    "pytz>=2026.1.post1",
]
